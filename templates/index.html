    <link rel="manifest" href="static/manifest.webmanifest">
    <link rel="icon" href="static/icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="static/apple-touch-icon.png" sizes="180x180">
    <meta name="apple-mobile-web-app-title" content="KE Restaurants">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Performance hints: warm up third-party origins we always need -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdn.sheetjs.com" crossorigin>
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org">
    <link rel="dns-prefetch" href="https://nominatim.openstreetmap.org">
    <link rel="dns-prefetch" href="https://overpass-api.de">

    <!-- Structured data: helps search engines understand & rich-render the site -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://stephenojwang235-rgb.github.io/kenya-restaurants/#website",
          "url": "https://stephenojwang235-rgb.github.io/kenya-restaurants/",
          "name": "Kenya Restaurant Finder",
          "description": "Live interactive map that finds restaurants in Kenya that don't yet have a website, with phone and WhatsApp contacts.",
          "inLanguage": "en",
          "publisher": { "@id": "https://stephenojwang235-rgb.github.io/kenya-restaurants/#app" }
        },
        {
          "@type": "WebApplication",
          "@id": "https://stephenojwang235-rgb.github.io/kenya-restaurants/#app",
          "name": "Kenya Restaurant Finder",
          "url": "https://stephenojwang235-rgb.github.io/kenya-restaurants/",
          "applicationCategory": "TravelApplication",
          "applicationSubCategory": "Restaurant finder",
          "operatingSystem": "Any (web browser)",
          "browserRequirements": "Requires JavaScript",
          "inLanguage": "en",
          "isAccessibleForFree": true,
          "description": "Interactive Leaflet map that locates restaurants in Kenya which do not yet have a website, lists their phone and WhatsApp contacts, and exports results to Excel.",
          "featureList": [
            "Live GPS location search",
            "Search restaurants by town or by all 47 Kenyan counties",
            "OpenStreetMap Overpass live queries",
            "Extract phone and WhatsApp contacts",
            "Export results to Excel",
            "Continuous live GPS tracking"
          ],
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KES" },
          "audience": { "@type": "Audience", "audienceType": "Restaurants and food businesses in Kenya" }
        }
      ]
    }
    </script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />

    <!-- SheetJS (xlsx) for Excel export (deferred: only needed on click) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"
            defer></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!--
      Crawlable / no-JS fallback content.
      Search engines that do not execute JavaScript (and users with JS
      disabled) still get real, keyword-rich text describing the app,
      instead of an empty shell.
    -->
    <noscript>
      <div class="seo-fallback">
        <h1>Kenya Restaurant Finder — find Kenyan restaurants without a website</h1>
        <p>
          Kenya Restaurant Finder is a free interactive map that shows
          restaurants across Kenya which do not yet have a website. It uses
          live OpenStreetMap data and works entirely in your browser.
        </p>
        <h2>What you can do</h2>
        <ul>
          <li>Find restaurants within 5 km of your current GPS location.</li>
          <li>Search any town or city in Kenya, or pick from all 47 counties.</li>
          <li>See each restaurant's phone number and WhatsApp contact.</li>
          <li>Export the results to an Excel spreadsheet.</li>
          <li>Track your location live and re-search automatically as you move.</li>
        </ul>
        <p>
          Coverage includes Nairobi, Mombasa, Kisumu, Nakuru, Eldoret, Thika,
          Malindi, and every other town and county in Kenya. This application
          requires JavaScript to display the live map.
        </p>
      </div>
    </noscript>

    <div class="dashboard">

        <!-- ===== LEFT SIDEBAR ===== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>🍽️ Kenyan Restaurants</h1>
                <p class="subtitle">Discover local dining across Kenya</p>
            </div>

            <div class="sidebar-controls">
                <button id="btn-gps" class="btn-primary">📍 Use Current GPS Location</button>

                <button id="btn-live" class="btn-secondary btn-live" style="margin-top:6px;width:100%;">
                    🛰️ Live Tracking: OFF
                </button>

                <div class="search-row">
                    <input type="text" id="search-input" placeholder="Enter a town/city in Kenya..." />
                    <button id="btn-search" class="btn-secondary">🔍 Search</button>
                </div>

                <div class="county-row">
                    <label for="county-select" class="control-label">Or select a County</label>
                    <div class="select-wrapper">
                        <select id="county-select">
                            <option value="">-- Select County --</option>
                            <option value="Baringo">Baringo</option>
                            <option value="Bomet">Bomet</option>
                            <option value="Bungoma">Bungoma</option>
                            <option value="Busia">Busia</option>
                            <option value="Elgeyo-Marakwet">Elgeyo-Marakwet</option>
                            <option value="Embu">Embu</option>
                            <option value="Garissa">Garissa</option>
                            <option value="Homa Bay">Homa Bay</option>
                            <option value="Isiolo">Isiolo</option>
                            <option value="Kajiado">Kajiado</option>
                            <option value="Kakamega">Kakamega</option>
                            <option value="Kericho">Kericho</option>
                            <option value="Kiambu">Kiambu</option>
                            <option value="Kilifi">Kilifi</option>
                            <option value="Kirinyaga">Kirinyaga</option>
                            <option value="Kisii">Kisii</option>
                            <option value="Kisumu">Kisumu</option>
                            <option value="Kitui">Kitui</option>
                            <option value="Kwale">Kwale</option>
                            <option value="Laikipia">Laikipia</option>
                            <option value="Lamu">Lamu</option>
                            <option value="Machakos">Machakos</option>
                            <option value="Makueni">Makueni</option>
                            <option value="Mandera">Mandera</option>
                            <option value="Marsabit">Marsabit</option>
                            <option value="Meru">Meru</option>
                            <option value="Migori">Migori</option>
                            <option value="Mombasa">Mombasa</option>
                            <option value="Murang'a">Murang'a</option>
                            <option value="Nairobi">Nairobi</option>
                            <option value="Nakuru">Nakuru</option>
                            <option value="Nandi">Nandi</option>
                            <option value="Narok">Narok</option>
                            <option value="Nyamira">Nyamira</option>
                            <option value="Nyandarua">Nyandarua</option>
                            <option value="Nyeri">Nyeri</option>
                            <option value="Samburu">Samburu</option>
                            <option value="Siaya">Siaya</option>
                            <option value="Taita-Taveta">Taita-Taveta</option>
                            <option value="Tana River">Tana River</option>
                            <option value="Tharaka-Nithi">Tharaka-Nithi</option>
                            <option value="Trans-Nzoia">Trans-Nzoia</option>
                            <option value="Turkana">Turkana</option>
                            <option value="Uasin Gishu">Uasin Gishu</option>
                            <option value="Vihiga">Vihiga</option>
                            <option value="Wajir">Wajir</option>
                            <option value="West Pokot">West Pokot</option>
                        </select>
                        <span class="select-arrow">▾</span>
                    </div>
                    <button id="btn-search-county" class="btn-secondary" style="margin-top:6px;width:100%;">🔍 Search County</button>
                </div>

                <div id="status" class="status-msg">
                    <span class="status-icon">ℹ️</span>
                    <span class="status-text">Search for restaurants to get started.</span>
                </div>

                <button id="btn-export-excel" class="btn-export" title="Download found restaurants as Excel">
                    📥 Download Excel Report
                </button>

                <button id="btn-save-db" class="btn-secondary" style="margin-top:6px;width:100%;" title="Save found restaurants to your Supabase cloud database">
                    ☁️ Save to Supabase
                </button>

                <button id="btn-refresh" class="btn-secondary" style="margin-top:6px;width:100%;">🔄 Refresh Here</button>
            </div>

            <!-- Restaurant Results List -->
            <div id="results-list" class="results-list">
                <div class="empty-state">
                    <span class="empty-icon">🍽️</span>
                    <div class="empty-title">No restaurants loaded yet</div>
                    <div>Use GPS, search a location, or select a county above.</div>
                </div>
            </div>
        </aside>

        <!-- ===== RIGHT MAP PANEL ===== -->
        <main class="map-panel">
            <div id="map"></div>
            <div id="map-controls" class="map-controls">
                <button id="btn-locate-all" class="map-btn" title="Fit all markers">
                    ⊞ Fit All
                </button>
            </div>
        </main>

        <!-- Mobile toggle button (visible only on small screens) -->
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
            ☰
        </button>
    </div>

    <!-- Leaflet JS (deferred) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""
            defer></script>

    <!-- Supabase JS v2 (cloud database — free, no API keys required) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

    <!-- Project configuration (paste your Supabase URL + anon key here) -->
    <script src="/static/config.js" defer></script>

    <!-- App Script -->
    <script src="/static/script.js" defer></script>
</body>
</html>
